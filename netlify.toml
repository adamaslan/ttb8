[build]
command = "npm run build"
publish = "build/client"

[dev]
command = "npm run dev"
framework = "vite"

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"

# CSP headers for Clerk authentication (follows Clerk's recommended CSP)
# See: https://clerk.com/docs/security/clerk-csp
[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://clerk.tastytechbytes.com https://accounts.tastytechbytes.com https://challenges.cloudflare.com https://pagead2.googlesyndication.com; connect-src 'self' https://clerk.tastytechbytes.com https://accounts.tastytechbytes.com https://clerk-telemetry.com; frame-src 'self' https://clerk.tastytechbytes.com https://accounts.tastytechbytes.com https://challenges.cloudflare.com https://pagead2.googlesyndication.com; worker-src 'self' blob:; img-src 'self' data: https://img.clerk.com https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;"
