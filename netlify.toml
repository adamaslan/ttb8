[build]
command = "npm run build"
publish = "build/client"

[dev]
command = "npm run dev"
framework = "vite"

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"

# CSP headers for Clerk authentication
[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.tastytechbytes.com https://accounts.tastytechbytes.com https://*.clerk.accounts.dev; connect-src 'self' https://clerk.tastytechbytes.com https://accounts.tastytechbytes.com https://*.clerk.accounts.dev; frame-src 'self' https://clerk.tastytechbytes.com https://accounts.tastytechbytes.com https://*.clerk.accounts.dev; worker-src 'self' blob:; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;"
